# Dependabot の設定。npm の依存と GitHub Actions のアクションを毎週まとめて更新する。
# 参考: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# labels は既定のラベル（dependencies など英語のもの）を「置き換える」。
# ここに書いたラベルは Dependabot が作らず、リポジトリに無ければ黙って無視される。
# .github/labels.yml に同じ名前で定義し、「ラベルを同期する」ワークフローを先に動かしておく。
#
# 確認者（reviewers）の設定は廃止された。確認を求める相手は .github/CODEOWNERS に書く。
version: 2

updates:
  # ---- npm。package.json と package-lock.json
  - package-ecosystem: npm
    directory: /
    # GitFlow に沿って、更新は develop に向けて開く。
    # セキュリティ更新は常に既定ブランチへ開かれ、そこにはこの設定の labels などが効かない。
    # 既定ブランチを develop にすると、すべてが develop に揃う
    target-branch: develop
    schedule:
      # 毎週月曜の朝に確かめる
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    labels:
      - 依存関係
      - npm
    # 同時に開く PR の上限。既定は 5。セキュリティ更新は数に入らない
    open-pull-requests-limit: 10
    # 公開されてから日数が経つまで取り込まない。壊れた版を掴まないためである。
    # 既定でも 3 日待つ。大きな更新ほど長く待つ
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # minor と patch の更新は 1 つの PR にまとめる。major は個別に開いて内容を確かめる
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      # 末尾が英数字なので、Dependabot がコロンを補う。「依存を更新: bump ...」の形になる
      prefix: 依存を更新
      include: scope

  # ---- GitHub Actions。.github/workflows の uses に書いたアクション
  - package-ecosystem: github-actions
    # GitHub Actions では / を指定する。.github/workflows と根の action.yml が対象になる
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    labels:
      - 依存関係
      - GitHub Actions
    open-pull-requests-limit: 5
    # github-actions は default-days だけに対応する
    cooldown:
      default-days: 7
    # アクションの更新はすべて 1 つの PR にまとめる。
    # github-actions では dependency-type が使えないため patterns で指定する
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: アクションを更新
