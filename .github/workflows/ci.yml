name: CI

# 文書の書式（markdownlint）と日本語の書き方（textlint）を検査する。
# 規則は公開されている共有設定 @223n/lint-config-ja にあり、
# このリポジトリには「何を検査するか」だけを書いてある。
#
# プロジェクト固有のビルドやテストは、lint-ja と並ぶジョブとして足す。
on:
  push:
    branches: [main, develop]
  pull_request:
  # 手で動かすため。
  # GITHUB_TOKEN が開いた PR（リリースの PR など）では、pull_request の実行は「承認待ち」で作られ、
  # 書き込み権限のある人が「Approve workflows to run」を押すまで動かない
  workflow_dispatch:

# 同じブランチに続けて push したとき、古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-ja:
    name: 日本語Lint
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # 固まったまま枠を占め続けないようにする
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Nodeを用意
        uses: actions/setup-node@v7
        with:
          # markdownlint-cli2 0.23 が Node 22 以上を求める
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: Markdownの書式を検査する
        run: npm run lint:md

      - name: 日本語の書き方を検査する
        run: npm run lint:ja
