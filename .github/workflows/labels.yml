name: ラベルを同期する

# .github/labels.yml の内容に、リポジトリのラベルを揃える。
# ファイルに無いラベルは消える。既定の英語のラベルは from_name で日本語のラベルに改名される。
#
# テンプレートから作った直後は、Actions の画面からこのワークフローを一度手で実行する。
# Dependabot が付けるラベルは、この同期が済んでいないと付かない。
on:
  push:
    branches: [main, develop]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  # PR では変更の内容を確かめるだけで、適用はしない
  pull_request:
    paths:
      - .github/labels.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: ラベルを揃える
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # ラベルの作成、変更、削除に要る
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: ラベルを揃える
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
          # ファイルに無いラベルは消す。画面で作ったラベルも消えるため、ラベルは必ずファイルに書く
          skip-delete: false
          # PR では何が変わるかを表示するだけにする
          dry-run: ${{ github.event_name == 'pull_request' }}
